name: Prompt Evaluation
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run:eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CML
        if: github.event_name == 'pull_request'
        run: npm install -g @dvcorg/cml

      - name: Build
        run: npm run build

      - name: Download baseline metrics
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: prompt-eval.yml
          branch: main
          name: evaluation-metrics
          path: baseline/
          if_no_artifact_found: warn

      - name: Configure API key
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          node -e "
          const { mkdirSync, writeFileSync } = require('fs');
          const { join, homedir } = require('path');
          const dir = join(process.env.XDG_CONFIG_HOME || join(homedir(), '.config'), 'zencommit');
          mkdirSync(dir, { recursive: true });
          writeFileSync(join(dir, 'config.json'), JSON.stringify({ key: process.env.OPENCODE_ZEN_API_KEY }, null, 2));
          "

      - name: Run benchmark tests
        env:
          RUN_BENCHMARK_TESTS: "1"
        run: npm run test:benchmark

      - name: Generate evaluation report
        run: npx tsx scripts/evaluate.ts

      - name: Post CML comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md

      - name: Upload evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics
          path: metrics.json
